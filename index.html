<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let user_ = prompt("Log-in:");

        if (user_ === "Admin") {
            let pass_ = prompt("Password:");

            if (pass_ === "TheMaster") {
                alert("Welcome!");
            } else if (pass_ === null || pass_ === "") {
                alert("Canceled");
            } else {
                alert("Wrong password");
            }
        }   
    </script>


</body>
</html>
